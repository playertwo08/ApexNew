<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#2559ed" />
    <meta name="description" content="Apex Sports — curated performance gear for every game." />
    <title>Apex Sports — Gear for every game</title>
    <style>
      :root { font-family: Arial, Helvetica, sans-serif; color: #0b152b; background: #f7f9fd; }
      body { margin: 0; }
      .vite-fallback { display: grid; min-height: 100vh; place-items: center; padding: 24px; text-align: center; }
      .vite-fallback div { max-width: 560px; }
      .vite-fallback span { display: inline-grid; width: 52px; height: 52px; place-items: center; border-radius: 16px; background: #2559ed; color: white; font-size: 24px; font-weight: 900; font-style: italic; }
      .vite-fallback h1 { margin: 24px 0 12px; font-size: clamp(2.75rem, 8vw, 5.5rem); line-height: .95; letter-spacing: -.06em; }
      .vite-fallback p { color: #61708b; font-size: 18px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main class="vite-fallback"><div><span aria-hidden="true">A</span><h1>Apex Sports</h1><p>Gear for every game. The Vite storefront is loading through its application router.</p></div></main>
  </body>
</html>
